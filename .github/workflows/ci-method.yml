name: CI method runner
on:
  workflow_call:
    inputs:
      runtime:
        required: true
        type: string
      method:
        required: true
        type: string
      port:
        required: false
        type: string

jobs:
  run-method:
    runs-on: ubuntu-latest
    env:
      PORT: ${{ inputs.port || '4426' }}
      TEST_ARGS: ${{ github.event.inputs.TEST_ARGS || '' }}
    steps:
      - uses: actions/checkout@v4

      # optional deno setup
      - name: Setup Deno
        if: ${{ inputs.runtime == 'deno' }}
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Download yt-dlp
        run: curl -L https://github.com/yt-dlp/yt-dlp-nightly-builds/releases/latest/download/yt-dlp -o yt-dlp && chmod +x ./yt-dlp

      # install and build server deps only for node script/server where required
      - name: Install and build server dependencies
        if: ${{ inputs.runtime == 'node' && inputs.method == 'script' }}
        run: cd server/ && npm ci && npx tsc

      - name: Install plugin
        run: |
          mkdir -p ~/yt-dlp-plugins/bgutil-ytdlp-pot-provider/
          cp -r plugin/ ~/yt-dlp-plugins/

      # Script method: run the script and perform same checks
      - name: Test script method
        if: ${{ inputs.method == 'script' }}
        shell: bash
        run: |
          exit_code=0

          if [ "${{ inputs.runtime }}" = "node" ]; then
            echo "script version: $(node server/build/generate_once.js --version)"
            script_output=$(node server/build/generate_once.js | tail -n 1)
          else
            echo "script version: $(deno run --allow-env --allow-ffi --allow-net "--allow-write=$HOME/.cache/bgutil-ytdlp-pot-provider" "--allow-read=$HOME/.cache/bgutil-ytdlp-pot-provider" server/src/generate_once.ts --version)"
            script_output=$(deno run --allow-env --allow-ffi --allow-net "--allow-write=$HOME/.cache/bgutil-ytdlp-pot-provider" "--allow-read=$HOME/.cache/bgutil-ytdlp-pot-provider" server/src/generate_once.ts | tail -n 1)
          fi

          echo "::group::POT response from the script"
          echo "$script_output" | jq -C
          echo "::endgroup::"

          poToken=$(echo "$script_output" | jq -r '.poToken')
          contentBinding=$(echo "$script_output" | jq -r '.contentBinding')

          if [[ "$poToken" == "null" || "$contentBinding" == "null" ]]; then
              echo "::error title=PoToken generation failed,file=server/src/session_manager.ts::'poToken' or 'contentBinding' is null."
              exit 1
          fi

          # expect this to fail, but make sure the plugin path is invoked
          if [ "${{ inputs.runtime }}" = "node" ]; then
            script_path=server/build/generate_once.js
          else
            script_path=server/src/generate_once.ts
          fi

          {
            script_response=$(./yt-dlp ${{ env.TEST_ARGS }} --extractor-args "youtubepot-bgutilscript:script_path=$script_path" dQw4w9WgXcQ 2>&1)
            ret=$?
          } || true

          echo "::group::Logs from yt-dlp"
          printf "%s\n" "$script_response"
          echo "::endgroup::"

          if [ "$ret" -ne 0 ]; then
            echo "::warning title=yt-dlp failed when testing script,file=plugin/yt_dlp_plugins/extractor/getpot_bgutil_script.py::yt-dlp returned $ret exit status"
          fi

          if [[ "$script_response" != *"[youtube] [pot:bgutil:script] TRACE: Generating POT via script: "* ]]; then
            echo "::error title=BgUtilScript was not invoked,file=plugin/yt_dlp_plugins/extractor/getpot_bgutil_script.py::BgUtilScript was not invoked"
            exit_code=1
          fi

          pot_response=$(echo "$script_response" | grep -A1 -m1 '\[youtube\] \[pot:bgutil:script\] TRACE: JSON response:' | tail -n1 | jq -r '.poToken')
          echo "POT: $pot_response"
          if [[ "$pot_response" == "null" || -z "$pot_response" || "$pot_response" == '""' ]]; then
             echo "::error title=Failed to generate POT,file=plugin/yt_dlp_plugins/extractor/getpot_bgutil_script.py::Failed to generate POT"
            [ "$exit_code" -eq 0 ] && exit_code=1
          fi

          exit $exit_code

      # Server method: start the server (docker for node, deno run for deno) and perform same checks
      - name: Test server method
        if: ${{ inputs.method == 'server' }}
        timeout-minutes: 3
        shell: bash
        run: |
          exit_code=0
          ping() {
            until curl -o- --silent --fail http://127.0.0.1:${{ env.PORT }}/ping 2>&1; do
              sleep ${1:-0.5}
            done
          }
          export -f ping

          if [ "${{ inputs.runtime }}" = "node" ]; then
            # build and run docker image (same as original server-method)
            docker build -t brainicism/bgutil-ytdlp-pot-provider:ci -f server/Dockerfile server/
            docker run --name bgutil-provider -d -p ${{ env.PORT }}:4416 brainicism/bgutil-ytdlp-pot-provider:ci
          else
            deno run --allow-env --allow-ffi --allow-net server/src/main.ts --port ${{ env.PORT }} &
            DENOPID=$!
          fi

          echo "Waiting for server to be up..."
          PING_RESP=$(timeout 70000 bash -c "ping 0.5") || \
            (echo "::error title=Timeout reached,file=server/src/main.ts::Timeout reached before the server is up." && if [ "${{ inputs.runtime }}" = "node" ]; then docker stop bgutil-provider || true; else kill $DENOPID || true; fi && exit 1)

          echo "::group::Response from HTTP server"
          if echo "$PING_RESP" | jq -e . >/dev/null 2>&1; then
            echo "$PING_RESP" | jq -C
          else
            echo "$PING_RESP"
          fi
          echo "::endgroup::"

          pot_response=$(curl -s -X POST "http://127.0.0.1:${{ env.PORT }}/get_pot")
          echo "::group::Get pot response from the HTTP server"
          if echo "$pot_response" | jq -e . >/dev/null 2>&1; then
            echo "$pot_response" | jq -C
          else
            echo "$pot_response"
          fi
          echo "::endgroup::"
          poToken=$(echo "$pot_response" | jq -r '.poToken')
          contentBinding=$(echo "$pot_response" | jq -r '.contentBinding')

          if [[ "$poToken" == "null" || "$contentBinding" == "null" ]]; then
              echo "::error title=PoToken generation failed,file=server/src/session_manager.ts::'poToken' or 'contentBinding' is null."
              if [ "${{ inputs.runtime }}" = "node" ]; then docker stop bgutil-provider || true; else kill $DENOPID || true; fi
              exit 1
          fi

          {
            server_response=$(./yt-dlp ${{ env.TEST_ARGS }} --extractor-args "youtubepot-bgutilhttp:base_url=http://127.0.0.1:${{ env.PORT }}" dQw4w9WgXcQ 2>&1)
            ret=$?
          } || true

          if [ "${{ inputs.runtime }}" = "node" ]; then
            docker stop bgutil-provider || true
          else
            echo "::group::Logs from Deno HTTP server process"
            ps -ef | grep deno || true
            echo "::endgroup::"
            kill $DENOPID || true
          fi

          echo "::group::Logs from yt-dlp"
          printf "%s\n" "$server_response"
          echo "::endgroup::"

          if [ "$ret" -ne 0 ]; then
            echo "::warning title=yt-dlp failed when testing HTTP server,file=plugin/yt_dlp_plugins/extractor/getpot_bgutil_http.py::yt-dlp returned $ret exit status"
          fi

          if [[ "$server_response" != *"[pot:bgutil:http] TRACE: Generating POT via HTTP server"* ]]; then
            echo "::error title=BgUtilHTTP was not invoked,file=plugin/yt_dlp_plugins/extractor/getpot_bgutil_http.py::BgUtilHTTP was not invoked"
            [ "$exit_code" -eq 0 ] && exit_code=1
          fi

          {
            po_token=$(echo "$server_response" | grep -m1 '\[youtube\] \[pot:bgutil:http\] TRACE: Generated POT: ' | sed 's/.*Generated POT: //')
          } || true
          echo "POT: $po_token"
          if [[ "$po_token" == "None" || -z "$po_token" ]]; then
             echo "::error title=Failed to generate POT,file=plugin/yt_dlp_plugins/extractor/getpot_bgutil_http.py::Failed to generate POT"
            [ "$exit_code" -eq 0 ] && exit_code=1
          fi

          exit $exit_code
